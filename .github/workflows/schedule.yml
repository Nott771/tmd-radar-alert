name: TMD Radar Auto Alert

on:
  schedule:
    - cron: '*/21 * * * *'
  workflow_dispatch:

jobs:
  run-radar-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests opencv-python-headless numpy pillow

      - name: Run TMD Radar Script
        env:
          RADAR_URL: ${{ secrets.RADAR_URL }}
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          MY_LINE_USER_ID: ${{ secrets.MY_LINE_USER_ID }}
          IMGBB_KEY: ${{ secrets.IMGBB_KEY }}
        run: python main.py
